[project]
name = "rolletto-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]  # Depends() defaults; pairwise zip(xs, xs[1:]) is intentionally ragged

[tool.ruff.lint.per-file-ignores]
"app/engine/assumptions.py" = ["E501"]  # the SPECS table reads best one assumption per line
